name: Deploy to AI Server

on:
  push:
    branches: [main]

jobs:
  build-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: personal-assistant/package-lock.json
      - name: Install assistant dependencies
        working-directory: personal-assistant
        run: npm ci
      - name: Build assistant
        working-directory: personal-assistant
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: npm run build

  deploy:
    needs: build-assistant
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: VITE_GOOGLE_CLIENT_ID
          script: |
            set -e
            cd ~/ai-course
            git pull --ff-only origin main
            npm ci --prefix personal-assistant
            npm run build --prefix personal-assistant
            test -f personal-assistant/dist/index.html
            source ~/ai-venv/bin/activate
            pip install -r requirements.txt --quiet

            # webapp 재시작 (screen 세션)
            screen -S webapp -X quit 2>/dev/null || true
            sleep 1
            screen -dmS webapp bash -c 'source ~/ai-venv/bin/activate && cd ~/ai-course && python webapp.py'
            sleep 2
            curl -sf http://localhost:8080/health
            curl -fsS --retry 3 --retry-all-errors --retry-delay 2 --resolve myai.itsdev.kr:443:127.0.0.1 https://myai.itsdev.kr/assistant/ > /dev/null
