name: Deploy to AI Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/ai-course
            git pull origin main
            source ~/ai-venv/bin/activate
            pip install -r requirements.txt --quiet

            # webapp 재시작 (screen 세션)
            screen -S webapp -X quit 2>/dev/null || true
            sleep 1
            screen -dmS webapp bash -c 'source ~/ai-venv/bin/activate && cd ~/ai-course && python webapp.py'
            sleep 2
            curl -sf http://localhost:8080/health && echo "webapp OK" || echo "webapp FAIL"
